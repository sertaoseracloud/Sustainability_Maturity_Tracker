name: Test maturity.json

on:
  push:
  pull_request:

jobs:
  test-json:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.x'
    - name: Install pytest
      run: pip install pytest
    - name: Run tests
      run: pytest -v
